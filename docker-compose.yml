# Production-like local run: Postgres + gunicorn serving the built React app.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: enxoval
      POSTGRES_USER: enxoval
      POSTGRES_PASSWORD: enxoval
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enxoval"]
      interval: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://enxoval:enxoval@db:5432/enxoval
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-compose-secret-change-me}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_SECURE_SSL_REDIRECT: "False"
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-registry@localhost}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
