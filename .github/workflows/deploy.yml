name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag to roll back to (leave empty to build HEAD)"
        required: false

concurrency:
  group: deploy-production # never let two deploys race on one VM
  cancel-in-progress: false

jobs:
  ci:
    # Nothing ships that has not passed the same checks a pull request gets.
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and push
    needs: ci
    if: ${{ !inputs.image_tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        run: |
          # Lowercase: GHCR rejects uppercase in a repository name.
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${repo}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Release to the VM
    needs: [ci, build]
    # `always()` so a rollback (which skips `build`) still runs.
    if: ${{ always() && needs.ci.result == 'success' && needs.build.result != 'failure' }}
    runs-on: ubuntu-latest
    environment: production # lets you require a manual approval in repo settings
    steps:
      - name: Pick the tag to release
        id: pick
        run: echo "tag=${{ inputs.image_tag || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key, not StrictHostKeyChecking=no: without this the
          # deploy would hand the VM's credentials to anyone who can spoof it.
          printf '%s\n' "${{ secrets.VM_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Release
        run: |
          ssh -o IdentitiesOnly=yes \
              "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" \
              "/opt/enxoval/release.sh '${{ steps.pick.outputs.tag }}'"

      - name: Clean up the key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
