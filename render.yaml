# Render.com blueprint. Push this repo to GitHub, then New → Blueprint on Render.
services:
  - type: web
    name: enxoval
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: enxoval-db
          property: connectionString
      # Set these in the Render dashboard to turn on claim emails:
      # EMAIL_HOST, EMAIL_PORT, EMAIL_HOST_USER, EMAIL_HOST_PASSWORD, DEFAULT_FROM_EMAIL

databases:
  - name: enxoval-db
    plan: free
